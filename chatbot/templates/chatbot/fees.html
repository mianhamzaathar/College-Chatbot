<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fees Structure</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">College Fees Structure</h2>
    <table class="table table-bordered">

            <tr>
                <th>Program</th>
                <th>Tuition Fee (per semester)</th>
                <th>Admission Fee</th>
                <th>Total Annual Fee</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>BS Computer Science</td>
                <td>Rs. 35,000</td>
                <td>Rs. 5,000</td>
                <td>Rs. 75,000</td>
            </tr>
            <tr>
                <td>BS Information Technology</td>
                <td>Rs. 33,000</td>
                <td>Rs. 5,000</td>
                <td>Rs. 71,000</td>
            </tr>
            <tr>
                <td>BBA</td>
                <td>Rs. 30,000</td>
                <td>Rs. 5,000</td>
                <td>Rs. 65,000</td>
            </tr>
            <tr>
                <td>BS Software Engineering</td>
                <td>Rs. 34,000</td>
                <td>Rs. 5,000</td>
                <td>Rs. 73,000</td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
