<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Collection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <img src="{{ book.image.url }}" alt="Book Cover" class="card-img-top">
    <style>
        .book-card {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .book-card:hover {
            transform: translateY(-5px);
        }
        .card-img-top {
            object-fit: cover;
            height: 200px;
        }
        .card-body {
            padding: 1.5rem;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4 text-center">Library Collection</h2>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for book in books %}
            <div class="col">
                <div class="card book-card">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Book Image">
                    <div class="card-body">
                        <h5 class="card-title">{{ book.title }}</h5>
                        <p class="card-text">Author: {{ book.author }}</p>
                        <p class="card-text">Published: {{ book.publication_date|date:"F j, Y" }}</p>
                        <p class="card-text">Available Copies: {{ book.available_copies }}</p>
                        <p class="card-text">{{ book.description }}</p>
                    </div>
                </div>
            </div>
        {% empty %}
            <div class="col-12">
                <div class="alert alert-warning" role="alert">
                    No books available at the moment.
                </div>
            </div>
        {% endfor %}
    </div>
</div>
</body>
</html>
