<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>College Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .gallery-img {
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s;
    }
    .gallery-img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center mb-4">📸 College Photo Gallery</h1>
    <div class="row g-4">
      <div class="col-md-4">
        <img src="https://source.unsplash.com/400x300/?college-campus" class="img-fluid gallery-img" alt="Campus">
      </div>
      <div class="col-md-4">
        <img src="https://source.unsplash.com/400x300/?students,classroom" class="img-fluid gallery-img" alt="Students">
      </div>
      <div class="col-md-4">
        <img src="https://source.unsplash.com/400x300/?library,books" class="img-fluid gallery-img" alt="Library">
      </div>
      <div class="col-md-4">
        <img src="https://source.unsplash.com/400x300/?science-lab" class="img-fluid gallery-img" alt="Science Lab">
      </div>
      <div class="col-md-4">
        <img src="https://source.unsplash.com/400x300/?college-events" class="img-fluid gallery-img" alt="Events">
      </div>
      <div class="col-md-4">
        <img src="https://source.unsplash.com/400x300/?sports-day,students" class="img-fluid gallery-img" alt="Sports Day">
      </div>
    </div>
  </div>
</body>
</html>
